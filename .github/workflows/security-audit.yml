# Security audit workflow (Stage 12 Day 4)
# 每周一跑：pip-audit + npm audit
# 发现高危 → fail PR + 标红

name: Security Audit

on:
  schedule:
    # 每周一 09:30 Asia/Shanghai (= 01:30 UTC)
    - cron: "30 1 * * 1"
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  # =======================================================================
  # Backend: pip-audit (OSV vulnerability database)
  # =======================================================================
  backend-audit:
    name: Backend · pip-audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install pip-audit
        run: python -m pip install --quiet pip-audit
      - name: Run pip-audit
        # Strict: fail on ANY known vulnerability
        run: |
          python -m pip_audit -r requirements.txt --vulnerability-service osv \
            --strict

  # =======================================================================
  # Frontend: npm audit
  # =======================================================================
  frontend-audit:
    name: Frontend · npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund --prefer-offline
      - name: Run npm audit
        # --audit-level=high: fail only on high/critical (not moderate/low)
        run: npm audit --audit-level=high
