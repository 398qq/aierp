name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aierp
          POSTGRES_PASSWORD: aierp
          POSTGRES_DB: aierp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff + mypy)
        run: |
          cd backend
          pip install ruff mypy types-passlib types-python-jose
          ruff check app/ tests/
          mypy app/ --ignore-missing-imports || true

      - name: Test with pytest
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://aierp:aierp@localhost:5432/aierp_test
          JWT_SECRET: ci-test-secret
        run: |
          cd backend
          pytest tests/ -v --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Type check
        run: |
          cd frontend
          npx tsc --noEmit || true

      - name: Test with vitest
        run: |
          cd frontend
          npx vitest run --reporter=verbose

      - name: Build check
        run: |
          cd frontend
          npm run build
