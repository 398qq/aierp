# Dependabot config (Stage 12 Day 4)
# 自动每周一检查依赖更新，PR 到 master
# - 风险评级
# - 自动 assign
# - 标签

version: 2
updates:
  # Backend Python deps (pip + requirements.txt)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    commit-message:
      prefix: "deps(backend)"
      include: "scope"
    labels:
      - "dependencies"
      - "backend"
      - "security"
    # 自动开 PR 但不自动 merge (等 CI + 人工 review)
    open-pull-requests-limit: 10
    # Group patch updates
    groups:
      patch-and-minor:
        update-types:
          - "minor"
          - "patch"
      major:
        update-types:
          - "major"

  # Frontend JS deps (npm + package.json)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    commit-message:
      prefix: "deps(frontend)"
      include: "scope"
    labels:
      - "dependencies"
      - "frontend"
      - "security"
    open-pull-requests-limit: 10
    groups:
      patch-and-minor:
        update-types:
          - "minor"
          - "patch"
      major:
        update-types:
          - "major"

  # ──────────────────────────────────────────────────────────────────
  # GitHub Actions ecosystem — DISABLED (Stage 18 Day 2, 2026-06-14)
  # ──────────────────────────────────────────────────────────────────
  # 原因:
  #   1. Stage 17 验出 dependabot github-actions PR 大概率撞 Node 20 EOL
  #      (rollup-plugin-visualizer@7 要求 Node ≥22, 我们跑 Node 20)
  #   2. Stage 18 9 个 dependabot PR 全部跟 actions 无关 — 关掉减少噪音
  #   3. Workflows 版本号只 3 个 (checkout / setup-node / setup-python),
  #      Node 22 升级后手动 bump 比每周 auto-PR 效率高
