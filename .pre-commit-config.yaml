# Pre-commit hooks (Stage 4 Day 2)
# Install: pre-commit install
# Run on all files: pre-commit run --all-files
#
# Goal: catch lint/format issues before they reach CI.
# Heavy CI checks (pytest, mypy, build) still run on GitHub Actions.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        name: ruff (Python linter)
        args: [--fix, --exit-non-zero-on-fix]
        files: ^backend/
      - id: ruff-format
        name: ruff-format (Python formatter)
        files: ^backend/
      # ruff-format enabled Stage 8 Day 1 after baseline format
      # of 272 tracked files. Future diffs stay small.

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: trim trailing whitespace
      - id: end-of-file-fixer
        name: fix end-of-file newlines
      - id: check-yaml
        name: validate YAML files
      - id: check-json
        name: validate JSON files
      - id: check-merge-conflict
        name: check for merge conflict markers
      - id: detect-private-key
        name: detect private keys

  # Stage 13 Day 4: detect-secrets (防密码 / API key 误提交)
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: detect secrets (passwords / API keys)
        args: ['--baseline', '.secrets.baseline']
        exclude: '\.lock$|package-lock\.json|\.db$|test\.db|backups/'

  # Stage 13 Day 4: bandit (Python 安全 linter, local)
  - repo: https://github.com/PyCQA/bandit
    rev: '1.7.10'  # 锁版本, 避免 hook 资源下载
    hooks:
      - id: bandit
        name: bandit (Python security linter, local baseline)
        args: ['-c', '.bandit', '-r', 'backend/app/']
        # 不用 --baseline JSON: local pass B110/B105, CI 另走 security-audit workflow
