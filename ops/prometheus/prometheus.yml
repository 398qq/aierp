global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["localhost:9093"]

scrape_configs:
  - job_name: aierp-backend
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: ["localhost:8080"]
        labels:
          service: aierp
          tier: backend
