<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIERP — 登录</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #0F0F0F;
      --paper: #FAFAFA;
      --muted: #6B6B6B;
      --rule: #DEDEDE;
      --white: #FFFFFF;
      --error: #C0392B;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--paper);
      color: var(--ink);
      height: 100vh;
      overflow: hidden;
    }

    .layout {
      display: grid;
      grid-template-columns: 420px 1fr;
      height: 100vh;
    }

    /* ── Left Brand Panel ── */
    .brand {
      background: var(--ink);
      color: var(--white);
      padding: 52px 48px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo-mark {
      width: 38px;
      height: 38px;
      background: var(--white);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-logo-mark svg { width: 22px; height: 22px; }

    .brand-name {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--white);
    }

    .brand-tagline {
      font-size: 10px;
      font-weight: 400;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .brand-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px 0;
    }

    .brand-headline {
      font-family: 'Playfair Display', serif;
      font-size: 44px;
      font-weight: 400;
      line-height: 1.12;
      color: var(--white);
      margin-bottom: 28px;
      letter-spacing: -0.025em;
    }

    .brand-headline em {
      font-style: italic;
      color: rgba(255,255,255,0.45);
    }

    .brand-sub {
      font-size: 13px;
      font-weight: 300;
      line-height: 1.8;
      color: rgba(255,255,255,0.38);
      max-width: 270px;
    }

    .brand-footer {
      font-size: 10px;
      color: rgba(255,255,255,0.18);
      letter-spacing: 0.04em;
    }

    /* ── Right Form Panel ── */
    .form-panel {
      background: var(--white);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px;
    }

    .form-wrap { width: 100%; max-width: 320px; }

    .form-heading {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 36px;
    }

    .rule-dot {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 36px;
    }

    .rule-dot .dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--rule);
    }

    .rule-dot .dot-accent {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .rule-dot .dot-accent::after {
      content: '';
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--white);
    }

    /* ── Field ── */
    .field { margin-bottom: 28px; }

    .field label {
      display: block;
      font-size: 11px;
      font-weight: 400;
      color: var(--muted);
      margin-bottom: 8px;
      letter-spacing: 0.02em;
    }

    .field input {
      width: 100%;
      border: none;
      border-bottom: 1px solid var(--rule);
      padding: 0 0 10px 0;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 300;
      color: var(--ink);
      background: transparent;
      outline: none;
      transition: border-color 0.2s;
    }

    .field input::placeholder { color: rgba(107,107,107,0.35); }
    .field input:focus { border-bottom-color: var(--ink); border-bottom-width: 1.5px; }

    /* ── Submit ── */
    .btn-signin {
      width: 100%;
      height: 50px;
      background: var(--ink);
      color: var(--white);
      border: none;
      border-radius: 2px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 12px;
      transition: background 0.18s, transform 0.08s;
      position: relative;
      overflow: hidden;
    }

    .btn-signin:hover { background: #242424; }
    .btn-signin:active { transform: scale(0.99); }
    .btn-signin:disabled { background: #B8B8B8; cursor: not-allowed; transform: none; }

    .loading-bar {
      position: absolute;
      left: 0; top: 0; height: 2px;
      background: rgba(255,255,255,0.45);
      width: 0%;
      animation: loadBar 1.2s ease-in-out infinite;
    }

    @keyframes loadBar {
      0%   { width: 0%; left: 0; }
      50%  { width: 55%; left: 22%; }
      100% { width: 0%; left: 100%; }
    }

    /* ── Error ── */
    .error-msg {
      font-size: 12px;
      color: var(--error);
      margin-top: 14px;
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity 0.2s, transform 0.2s;
    }
    .error-msg.visible { opacity: 1; transform: translateY(0); }

    /* ── Footer ── */
    .form-footer {
      margin-top: 52px;
      font-size: 10px;
      color: rgba(107,107,107,0.4);
      text-align: center;
      letter-spacing: 0.04em;
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      .brand { padding: 40px 32px; min-height: 200px; }
      .brand-headline { font-size: 28px; }
      .brand-center { padding: 24px 0; }
      .form-panel { padding: 40px 32px; }
    }

    /* ── Tweaks Panel ── */
    .tweaks {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--ink);
      color: var(--white);
      padding: 16px 20px;
      border-radius: 4px;
      font-size: 11px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 160px;
    }
    .tweaks-label {
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      margin-bottom: 4px;
    }
    .tweak-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .tweak-item span { color: rgba(255,255,255,0.65); }
    .tweak-btn {
      width: 16px; height: 16px;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.35);
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .tweak-btn.active {
      border-color: var(--white);
      box-shadow: 0 0 0 2px rgba(255,255,255,0.15);
    }
  </style>
</head>
<body>

<div class="layout" id="layout">

  <!-- Left Brand Panel -->
  <div class="brand">
    <div class="brand-logo">
      <div class="brand-logo-mark">
        <svg viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="8" height="8" rx="1.5" fill="#0F0F0F"/>
          <rect x="12" y="2" width="8" height="8" rx="1.5" fill="#0F0F0F" opacity="0.35"/>
          <rect x="2" y="12" width="8" height="8" rx="1.5" fill="#0F0F0F" opacity="0.35"/>
          <rect x="12" y="12" width="8" height="8" rx="1.5" fill="#0F0F0F" opacity="0.15"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">AIERP</div>
        <div class="brand-tagline">Intelligent Distribution</div>
      </div>
    </div>

    <div class="brand-center">
      <h1 class="brand-headline">
        智能分销<br>
        <em>重新定义</em><br>
        元器件贸易
      </h1>
      <p class="brand-sub">
        AI 驱动的电子元器件全链路管理系统。<br>
        商机洞察 · 库存优化 · 供应商协同
      </p>
    </div>

    <div class="brand-footer">
      © 2025 AIERP · Electronic Component Distribution Platform
    </div>
  </div>

  <!-- Right Form Panel -->
  <div class="form-panel">
    <div class="form-wrap">

      <div class="form-heading">Sign in to your account</div>

      <div class="rule-dot">
        <div class="dot-accent"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>

      <form id="loginForm" autocomplete="off">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="admin" autocomplete="username" spellcheck="false">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button type="submit" class="btn-signin" id="submitBtn">
          Sign in
          <div class="loading-bar" id="loadingBar" style="display:none"></div>
        </button>
        <div class="error-msg" id="errorMsg">Invalid credentials. Please try again.</div>
      </form>

      <div class="form-footer">AIERP · 智能电子元器件分销管理系统</div>
    </div>
  </div>

</div>

<!-- Tweaks -->
<div class="tweaks">
  <div class="tweaks-label">Design Variants</div>
  <div class="tweak-item">
    <span>Light panel</span>
    <div class="tweak-btn active" id="t-light" onclick="setPanel('light')"></div>
  </div>
  <div class="tweak-item">
    <span>Dark panel</span>
    <div class="tweak-btn" id="t-dark" onclick="setPanel('dark')"></div>
  </div>
  <div class="tweak-item">
    <span>Inverted</span>
    <div class="tweak-btn" id="t-inv" onclick="setPanel('inverted')"></div>
  </div>
</div>

<script>
  const form = document.getElementById('loginForm');
  const submitBtn = document.getElementById('submitBtn');
  const loadingBar = document.getElementById('loadingBar');
  const errorMsg = document.getElementById('errorMsg');
  const layout = document.getElementById('layout');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value;
    if (!u || !p) return;

    submitBtn.disabled = true;
    loadingBar.style.display = 'block';
    errorMsg.classList.remove('visible');

    await new Promise(r => setTimeout(r, 1400));

    if (u === 'admin' && p === 'admin123') {
      submitBtn.textContent = 'Redirecting…';
      await new Promise(r => setTimeout(r, 500));
      window.location.href = '/';
    } else {
      submitBtn.disabled = false;
      loadingBar.style.display = 'none';
      errorMsg.classList.add('visible');
      submitBtn.textContent = 'Sign in';
    }
  });

  function setPanel(mode) {
    document.querySelectorAll('.tweak-btn').forEach(b => b.classList.remove('active'));
    const brand = document.querySelector('.brand');
    const formPanel = document.querySelector('.form-panel');

    if (mode === 'light') {
      layout.style.filter = '';
      layout.style.gridTemplateColumns = '420px 1fr';
      brand.style.background = '#1A1A1A';
      formPanel.style.background = '#FAFAFA';
      document.getElementById('t-light').classList.add('active');
    } else if (mode === 'dark') {
      layout.style.filter = 'invert(1)';
      document.getElementById('t-dark').classList.add('active');
    } else if (mode === 'inverted') {
      layout.style.filter = '';
      layout.style.gridTemplateColumns = '1fr 420px';
      brand.style.background = '#FAFAFA';
      document.querySelector('.brand-name, .brand-tagline, .brand-headline, .brand-sub').style.color = '#0F0F0F';
      document.querySelector('.brand-sub').style.color = '#6B6B6B';
      document.querySelector('.brand-tagline').style.color = 'rgba(15,15,15,0.4)';
      document.querySelector('.brand-footer').style.color = 'rgba(15,15,15,0.25)';
      formPanel.style.background = '#0F0F0F';
      document.querySelector('.form-heading').style.color = 'rgba(255,255,255,0.4)';
      document.querySelector('.form-footer').style.color = 'rgba(255,255,255,0.25)';
      document.getElementById('t-inv').classList.add('active');
    }
  }
</script>

</body>
</html>
