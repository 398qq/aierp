<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIERP — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #08080C;
      --card-bg: rgba(255,255,255,0.04);
      --card-border: rgba(255,255,255,0.09);
      --ink: #FFFFFF;
      --muted: rgba(255,255,255,0.38);
      --rule: rgba(255,255,255,0.09);
      --accent: #6366F1;
      --accent-dim: rgba(99,102,241,0.18);
      --error: #F87171;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      overflow: hidden;
    }

    /* ── Canvas ── */
    .canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    /* Grid */
    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 100%);
    }

    /* Orb A — slow cyan drift */
    .orb-a {
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99,102,241,0.22) 0%, transparent 70%);
      top: -150px;
      left: -100px;
      animation: orbA 18s ease-in-out infinite;
      filter: blur(60px);
    }

    @keyframes orbA {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33%       { transform: translate(80px, 60px) scale(1.08); }
      66%       { transform: translate(-40px, 100px) scale(0.95); }
    }

    /* Orb B — slow rose drift */
    .orb-b {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(168,85,247,0.15) 0%, transparent 70%);
      bottom: -100px;
      right: -80px;
      animation: orbB 22s ease-in-out infinite;
      filter: blur(70px);
    }

    @keyframes orbB {
      0%, 100% { transform: translate(0, 0) scale(1); }
      40%       { transform: translate(-70px, -50px) scale(1.1); }
      70%       { transform: translate(40px, -80px) scale(0.9); }
    }

    /* Subtle scanline vignette */
    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 100% 100% at 50% 50%, transparent 50%, rgba(0,0,0,0.6) 100%);
    }

    /* ── Card ── */
    .card-wrap {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 48px 44px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04) inset,
        0 24px 48px rgba(0,0,0,0.5),
        0 0 80px rgba(99,102,241,0.06);
    }

    /* Brand mark */
    .brand {
      text-align: center;
      margin-bottom: 40px;
    }

    .brand-name {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .brand-product {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    /* Rule */
    .rule {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 36px;
    }

    .rule-line {
      flex: 1;
      height: 1px;
      background: var(--rule);
    }

    .rule-diamond {
      width: 5px;
      height: 5px;
      background: var(--accent);
      transform: rotate(45deg);
      flex-shrink: 0;
    }

    /* Heading */
    .form-heading {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.06em;
      color: var(--muted);
      text-align: center;
      margin-bottom: 28px;
    }

    /* Fields */
    .field {
      margin-bottom: 20px;
    }

    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 400;
      color: var(--muted);
      margin-bottom: 8px;
      letter-spacing: 0.02em;
    }

    .field-input {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--rule);
      border-radius: 8px;
      padding: 12px 14px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 300;
      color: var(--ink);
      outline: none;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
      caret-color: var(--accent);
    }

    .field-input::placeholder { color: rgba(255,255,255,0.2); }

    .field-input:focus {
      border-color: var(--accent);
      background: rgba(99,102,241,0.06);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    /* Password toggle */
    .password-wrap {
      position: relative;
    }

    .password-wrap .field-input {
      padding-right: 42px;
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
      padding: 4px;
      transition: color 0.15s;
      line-height: 1;
    }

    .password-toggle:hover { color: var(--ink); }

    /* Submit */
    .btn-signin {
      width: 100%;
      height: 46px;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: #FFFFFF;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.18s, transform 0.08s, box-shadow 0.18s;
      position: relative;
      overflow: hidden;
    }

    .btn-signin:hover:not(:disabled) {
      background: #7C7FF2;
      box-shadow: 0 4px 20px rgba(99,102,241,0.4);
    }

    .btn-signin:active:not(:disabled) { transform: scale(0.99); }
    .btn-signin:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Loading shimmer */
    .btn-signin .shimmer {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255,255,255,0.25) 50%,
        transparent 100%
      );
      transform: translateX(-100%);
      animation: shimmer 1.4s ease-in-out infinite;
    }

    @keyframes shimmer {
      100% { transform: translateX(100%); }
    }

    /* Error */
    .error-msg {
      font-size: 12px;
      color: var(--error);
      margin-top: 12px;
      text-align: center;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 0.2s, transform 0.2s;
      min-height: 18px;
    }

    .error-msg.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Card footer */
    .card-footer {
      margin-top: 36px;
      text-align: center;
      font-size: 10px;
      color: rgba(255,255,255,0.15);
      letter-spacing: 0.04em;
    }

    /* ── Accent glow behind card ── */
    .card-glow {
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99,102,241,0.12) 0%, transparent 70%);
      filter: blur(40px);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: -1;
      animation: cardGlow 6s ease-in-out infinite;
    }

    @keyframes cardGlow {
      0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
      50%       { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .card { padding: 36px 28px; }
    }

    /* ── Tweaks ── */
    .tweaks {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.7);
      padding: 16px 20px;
      border-radius: 10px;
      font-size: 11px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 160px;
      backdrop-filter: blur(12px);
    }

    .tweaks-title {
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.28);
      margin-bottom: 2px;
    }

    .tweak-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .tweak-row label { color: rgba(255,255,255,0.55); }

    .tweak-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.3);
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .tweak-dot.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(99,102,241,0.25);
    }

    /* ── Particles ── */
    .particle {
      position: absolute;
      width: 1px;
      height: 1px;
      border-radius: 50%;
      background: rgba(255,255,255,0.4);
      animation: particleFloat linear infinite;
      pointer-events: none;
    }

    @keyframes particleFloat {
      0%   { transform: translateY(0) translateX(0); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(-100vh) translateX(30px); opacity: 0; }
    }
  </style>
</head>
<body>

<!-- ── Canvas / Background ── -->
<div class="canvas" id="canvas">
  <div class="grid"/>
  <div class="orb-a"/>
  <div class="orb-b"/>
  <div class="vignette"/>
  <!-- Particles injected by JS -->
</div>

<!-- ── Card ── -->
<div class="card-wrap">
  <div class="card-glow"/>
  <div class="card">

    <div class="brand">
      <div class="brand-name">Electronic Distribution</div>
      <div class="brand-product">AIERP</div>
    </div>

    <div class="rule">
      <div class="rule-line"/>
      <div class="rule-diamond"/>
      <div class="rule-line"/>
    </div>

    <div class="form-heading">Intelligent sign in</div>

    <form id="loginForm" autocomplete="off">
      <div class="field">
        <label class="field-label" for="username">Username</label>
        <input
          class="field-input"
          type="text"
          id="username"
          placeholder="admin"
          autocomplete="username"
          spellcheck="false"
        >
      </div>

      <div class="field">
        <label class="field-label" for="password">Password</label>
        <div class="password-wrap">
          <input
            class="field-input"
            type="password"
            id="password"
            placeholder="••••••••"
            autocomplete="current-password"
          >
          <button type="button" class="password-toggle" id="pwdToggle"
            onclick="togglePassword()">◉</button>
        </div>
      </div>

      <button type="submit" class="btn-signin" id="submitBtn">
        <span class="shimmer" id="shimmer" style="display:none"/>
        <span id="btnText">Sign in</span>
      </button>

      <div class="error-msg" id="errorMsg">Invalid credentials</div>
    </form>

    <div class="card-footer">AIERP · Intelligent Distribution Platform · 2025</div>
  </div>
</div>

<!-- ── Tweaks ── -->
<div class="tweaks">
  <div class="tweaks-title">Accent Color</div>
  <div class="tweak-row">
    <label>Indigo</label>
    <div class="tweak-dot active" id="t-indigo" style="background:#6366F1" onclick="setAccent('#6366F1','#7C7FF2','rgba(99,102,241,0.18)')"></div>
  </div>
  <div class="tweak-row">
    <label>Cyan</label>
    <div class="tweak-dot" id="t-cyan" style="background:#06B6D4" onclick="setAccent('#06B6D4','#22D3EE','rgba(6,182,212,0.18)')"></div>
  </div>
  <div class="tweak-row">
    <label>Emerald</label>
    <div class="tweak-dot" id="t-emerald" style="background:#10B981" onclick="setAccent('#10B981','#34D399','rgba(16,185,129,0.18)')"></div>
  </div>
  <div class="tweak-row">
    <label>Rose</label>
    <div class="tweak-dot" id="t-rose" style="background:#F43F5E" onclick="setAccent('#F43F5E','#FB7185','rgba(244,63,94,0.18)')"></div>
  </div>
</div>

<script>
  // ── Particles
  const canvas = document.getElementById('canvas');
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.bottom = '-4px';
    p.style.animationDuration = (8 + Math.random() * 12) + 's';
    p.style.animationDelay = (Math.random() * 10) + 's';
    p.style.width = p.style.height = (1 + Math.random() * 2) + 'px';
    canvas.appendChild(p);
  }

  // ── Password toggle
  function togglePassword() {
    const inp = document.getElementById('password');
    const tog = document.getElementById('pwdToggle');
    if (inp.type === 'password') {
      inp.type = 'text';
      tog.textContent = '○';
    } else {
      inp.type = 'password';
      tog.textContent = '◉';
    }
  }

  // ── Accent switcher
  function setAccent(color, hover, dim) {
    document.documentElement.style.setProperty('--accent', color);
    document.documentElement.style.setProperty('--accent-dim', dim);
    document.querySelectorAll('.tweak-dot').forEach(d => d.classList.remove('active'));
    document.getElementById('t-' + {
      '#6366F1':'indigo','#06B6D4':'cyan',
      '#10B981':'emerald','#F43F5E':'rose'
    }[color]).classList.add('active');
  }

  // ── Form
  const form = document.getElementById('loginForm');
  const submitBtn = document.getElementById('submitBtn');
  const shimmer = document.getElementById('shimmer');
  const btnText = document.getElementById('btnText');
  const errorMsg = document.getElementById('errorMsg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value;
    if (!u || !p) return;

    submitBtn.disabled = true;
    shimmer.style.display = 'block';
    btnText.textContent = 'Signing in…';
    errorMsg.classList.remove('visible');

    await new Promise(r => setTimeout(r, 1500));

    if (u === 'admin' && p === 'admin123') {
      btnText.textContent = 'Welcome back';
      await new Promise(r => setTimeout(r, 400));
      window.location.href = '/';
    } else {
      submitBtn.disabled = false;
      shimmer.style.display = 'none';
      btnText.textContent = 'Sign in';
      errorMsg.classList.add('visible');
    }
  });
</script>

</body>
</html>
